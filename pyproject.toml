[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passive-scan-v9"
version = "9.0.0"
description = "Evidence-oriented reconnaissance, change tracking and manual review"
requires-python = ">=3.10"
dependencies = ["openpyxl==3.1.5", "PyYAML==6.0.2"]

[project.scripts]
passive-scan = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]
